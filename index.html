<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HAUNT — Million Dollar App</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Georgia, 'Times New Roman', serif;
      background: radial-gradient(1200px 600px at 50% -10%, #3a1a12 0%, #0b0908 55%, #050403 100%);
      color: #f4e8d8;
    }
    main { text-align: center; padding: 2rem; max-width: 36rem; }
    h1 { letter-spacing: .28em; font-weight: 400; font-size: clamp(2rem, 6vw, 3.4rem); margin: 0 0 .5rem; }
    p { opacity: .8; line-height: 1.6; }
    .tag { display: inline-block; border: 1px solid #c9a36a66; color: #c9a36a; letter-spacing: .2em; font-size: .7rem; padding: .35rem .7rem; margin-bottom: 1.25rem; }
    .ok { margin-top: 1.5rem; font-size: .85rem; color: #8fbf8a; letter-spacing: .08em; }
  </style>
</head>
<body>
  <main>
    <div class="tag">LIVE ON VERCEL</div>
    <h1>HAUNT</h1>
    <p>Million-dollar app scaffold. If you can read this, the GitHub &rarr; Vercel pipeline is working.</p>
    <div class="ok">Deployment check passed</div>
  </main>
</body>
</html>
